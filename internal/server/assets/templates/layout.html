{{define "head"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - vimp</title>
    <script>
        // Apply theme early to prevent flash and ensure charts detect correct theme
        (function() {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">vimp</a>
            <span class="version">{{.Version}}</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/images" class="nav-link">Images</a>
        </div>
        <div class="nav-actions">
            <button id="theme-toggle" class="btn-icon" title="Toggle theme">
                <span class="icon-sun">&#9728;</span>
                <span class="icon-moon">&#9790;</span>
            </button>
        </div>
    </nav>
    <main class="container">
{{end}}

{{define "foot"}}
    </main>
    <footer class="footer">
        <span>Database: {{.Target}}</span>
    </footer>
    <script>
        // Theme toggle (initialization handled in head)
        document.getElementById('theme-toggle').addEventListener('click', function() {
            var html = document.documentElement;
            var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    </script>
</body>
</html>
{{end}}
