name: Combine Dependabot PRs

on:
  workflow_dispatch:
    inputs:
      branch_prefix:
        description: 'Branch prefix to match (e.g., dependabot/github_actions)'
        required: true
        default: 'dependabot/github_actions'

permissions:
  contents: write
  pull-requests: write

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get Dependabot PRs
        id: get-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get all open PRs matching the branch prefix
          prs=$(gh pr list --state open --json number,headRefName,title \
            --jq '.[] | select(.headRefName | startswith("${{ inputs.branch_prefix }}")) | "\(.number)|\(.headRefName)|\(.title)"')

          if [ -z "$prs" ]; then
            echo "No matching PRs found"
            echo "has_prs=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found PRs:"
          echo "$prs"
          echo "has_prs=true" >> $GITHUB_OUTPUT

          # Save PR info for later
          echo "$prs" > /tmp/prs.txt

          # Count PRs
          pr_count=$(echo "$prs" | wc -l | tr -d ' ')
          echo "pr_count=$pr_count" >> $GITHUB_OUTPUT

      - name: Create combined branch
        if: steps.get-prs.outputs.has_prs == 'true'
        id: combine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a new branch for combined changes
          combined_branch="dependabot/combined-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$combined_branch"

          echo "Combined branch: $combined_branch"
          echo "branch=$combined_branch" >> $GITHUB_OUTPUT

          # Track merged PRs for the PR body
          merged_prs=""
          failed_prs=""

          # Merge each Dependabot branch
          while IFS='|' read -r pr_number branch title; do
            echo "Processing PR #$pr_number: $title"

            # Fetch the branch
            git fetch origin "$branch"

            # Try to merge
            if git merge --no-edit "origin/$branch"; then
              echo "Successfully merged: $branch"
              merged_prs="$merged_prs- #$pr_number: $title\n"
            else
              echo "Failed to merge: $branch (conflict)"
              git merge --abort
              failed_prs="$failed_prs- #$pr_number: $title\n"
            fi
          done < /tmp/prs.txt

          # Save for PR body
          echo -e "$merged_prs" > /tmp/merged.txt
          echo -e "$failed_prs" > /tmp/failed.txt

          # Push combined branch
          git push origin "$combined_branch"

      - name: Create combined PR
        if: steps.get-prs.outputs.has_prs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          merged=$(cat /tmp/merged.txt)
          failed=$(cat /tmp/failed.txt)

          body="## Combined Dependabot Updates

          This PR combines multiple Dependabot PRs into a single update.

          ### Included PRs
          $merged
          "

          if [ -n "$failed" ]; then
            body="$body
          ### Failed to merge (conflicts)
          $failed
          "
          fi

          body="$body
          ---
          *Auto-generated by combine-dependabot workflow*"

          gh pr create \
            --title "chore(deps): combined dependabot updates" \
            --body "$body" \
            --head "${{ steps.combine.outputs.branch }}" \
            --base main

      - name: Summary
        if: steps.get-prs.outputs.has_prs == 'true'
        run: |
          echo "## Combined Dependabot PRs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Created combined PR from ${{ steps.get-prs.outputs.pr_count }} Dependabot PRs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Merged:" >> $GITHUB_STEP_SUMMARY
          cat /tmp/merged.txt >> $GITHUB_STEP_SUMMARY
          if [ -s /tmp/failed.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed (conflicts):" >> $GITHUB_STEP_SUMMARY
            cat /tmp/failed.txt >> $GITHUB_STEP_SUMMARY
          fi
