name: Scan Code

on:
  schedule:
    - cron: '0 5 * * 1'  # Weekly on Monday at 5am UTC
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a65a038433a26f4363cf9f029e3b9ceac831ad5d  # v3.28.10
        with:
          languages: go

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@a65a038433a26f4363cf9f029e3b9ceac831ad5d  # v3.28.10
