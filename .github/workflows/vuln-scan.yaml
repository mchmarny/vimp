name: Daily Vulnerability Scan

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: scheduled-trivy-scan
  cancel-in-progress: false

env:
  SARIF_OUTPUT: 'vulnerability-scan-results.sarif'
  SEVERITY_LEVELS: 'HIGH,CRITICAL'

jobs:
  trivy-repo-scan:
    name: Scan Repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Scan Repository
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8  # 0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          vuln-type: 'os,library'
          scanners: 'vuln,secret,misconfig'
          ignore-unfixed: true
          format: 'sarif'
          output: ${{ env.SARIF_OUTPUT }}
          severity: ${{ env.SEVERITY_LEVELS }}
          skip-dirs: 'vendor,node_modules'
          limit-severities-for-sarif: true

      - name: Check SARIF file exists
        id: check_sarif
        run: |
          if [ -f "${{ env.SARIF_OUTPUT }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload SARIF Report
        if: steps.check_sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@a65a038433a26f4363cf9f029e3b9ceac831ad5d  # v3.28.10
        with:
          sarif_file: ${{ env.SARIF_OUTPUT }}
