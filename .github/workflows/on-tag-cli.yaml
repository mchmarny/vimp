name: On-Tag Release CLI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run all tests before release
  test:
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      security-events: write

  # Build and release after tests pass
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      hashes: ${{ steps.checksum.outputs.hashes }}
      image_digest: ${{ steps.release.outputs.image_digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0  # v0.18.0
        with:
          syft-version: ${{ steps.versions.outputs.syft }}

      - name: Setup ko
        uses: ko-build/setup-ko@d982fec422852203cfb2053a8ec6ad302280d04d  # v0.8

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Release
        id: release
        uses: goreleaser/goreleaser-action@90a3faa9d0182683851fbfa97ca1a2cb983bfca3  # v6.2.1
        with:
          distribution: goreleaser
          version: ${{ steps.versions.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/mchmarny/vimp

      - name: Generate Checksums
        id: checksum
        env:
          ARTIFACTS: "${{ steps.release.outputs.artifacts }}"
        run: |
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          echo "hashes=$(cat $checksum_file | base64 -w0)" >> $GITHUB_OUTPUT

      - name: Get Image Digest
        id: image_digest
        run: |
          DIGEST=$(crane digest ghcr.io/mchmarny/vimp:${{ github.ref_name }} 2>/dev/null || echo "")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

  # Generate SLSA provenance
  provenance:
    name: Generate Provenance
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
      compile-generator: true

  # Attest container image
  attest:
    name: Attest Image
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.image_digest != ''
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Image
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2  # v2.2.3
        with:
          subject-name: ghcr.io/mchmarny/vimp
          subject-digest: ${{ needs.release.outputs.image_digest }}
          push-to-registry: true

  # Verify provenance
  verify:
    name: Verify Provenance
    needs: [release, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: read-all
    env:
      ATT_FILE_NAME: "multiple.intoto.jsonl"
    steps:
      - name: Install SLSA Verifier
        uses: slsa-framework/slsa-verifier/actions/installer@6657aada084353c65e5dde35394b1a010289fab0  # v2.7.0

      - name: Download Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "vimp*"
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "$ATT_FILE_NAME"

      - name: Verify Assets
        env:
          CHECKSUMS: ${{ needs.release.outputs.hashes }}
        run: |
          set -euo pipefail
          checksums=$(echo "$CHECKSUMS" | base64 -d)
          while read -r line; do
              artifact=$(echo $line | cut -d ' ' -f2)
              slsa-verifier verify-artifact --provenance-path "$ATT_FILE_NAME" \
                                            --source-uri "github.com/$GITHUB_REPOSITORY" \
                                            --source-tag "$GITHUB_REF_NAME" \
                                            "$artifact"
          done <<<"$checksums"
