name: build_image

on:
  workflow_call:
    inputs:
      image_repo:
        description: 'Fully-qualified image repo (registry/project/repo)'
        required: true
        type: string
      image_name:
        description: 'Image name (e.g. my-image)'
        required: true
        type: string
      auth_provider:
        description: 'OIDC provider ID'
        required: true
        type: string
      auth_user:
        description: 'OIDC user ID'
        required: true
        type: string
      go_version:
        description: 'Go version to use'
        required: true
        type: string
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:

    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Setup Go
      uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
      with:
        go-version: '${{ inputs.go_version }}'
        cache: true

    - name: Tidy Modules
      run: go mod tidy

    - id: auth
      name: Auth GCP
      uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935  # v2.1.8
      with:
        token_format: "access_token"
        workload_identity_provider: ${{ inputs.auth_provider }}
        service_account: ${{ inputs.auth_user }}

    - name: Install ko
      uses: ko-build/setup-ko@d982fec422852203cfb2053a8ec6ad302280d04d  # v0.8

    - name: Authenticate ko
      env:
        AUTH_TOKEN: ${{ steps.auth.outputs.access_token }}
      run: |
        set -euo pipefail
        reg=$(echo ${{ inputs.image_repo }} | cut -d/ -f1)
        echo "${AUTH_TOKEN}" | ko login ${reg} --username oauth2accesstoken --password-stdin

    - name: Get Version
      id: version
      run: |
        set -euo pipefail
        echo "release=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

    - name: Build Image
      id: image
      env:
        KO_DOCKER_REPO: ${{ inputs.image_repo }}/${{ inputs.image_name }}
        GOFLAGS: "-ldflags=-X=main.version=${{ steps.version.outputs.release }}"
        COSIGN_EXPERIMENTAL: "true"
      run: |
        set -euo pipefail
        ko build main.go --image-refs .digest --bare --tags ${{ steps.version.outputs.release }}
        echo "digest=$(cat .digest)" >> "$GITHUB_OUTPUT"
