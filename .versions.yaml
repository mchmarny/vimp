# Centralized version management for CI/CD
# All tools and dependencies should be pinned here

# Language Versions
languages:
  go: '1.23'

# Build Tools
build_tools:
  goreleaser: 'v2'
  ko: 'v0.18.0'
  crane: 'v0.20.6'
  syft: 'v1.9.0'
  git_cliff: '2.7.0'

# Linting
linting:
  golangci_lint: 'v1.61.0'
  yamllint: '1.35.0'

# Security Tools
security_tools:
  cosign: 'v2.4.0'
  trivy: '0.56.0'
  grype: 'v0.82.0'

# Testing
testing:
  coverage_threshold: '70'
