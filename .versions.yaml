# Centralized version management for CI/CD
# All tools and dependencies should be pinned here

# Language Versions
languages:
  go: '1.25'

# Build Tools
build_tools:
  goreleaser: 'v2.13.3'
  ko: 'v0.18.1'
  crane: 'v0.20.7'
  syft: 'v1.41.2'

# Linting
linting:
  golangci_lint: 'v2.8.0'
  yamllint: '1.38.0'

# Security Tools
security_tools:
  cosign: 'v3.0.4'
  trivy: '0.69.1'
  grype: 'v0.107.1'

# Testing
testing:
  coverage_threshold: '50'
